services:
  minio:
    image: minio/minio:latest
    container_name: dynamic-config-minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # This service creates the bucket and uploads initial config
  minio-init:
    image: minio/mc:latest
    container_name: dynamic-config-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/config-bucket --ignore-existing;
      mc cp /config/app-config.json local/config-bucket/app-config.json;
      mc anonymous set download local/config-bucket;
      echo 'Bucket created and config uploaded!';
      exit 0;
      "
    volumes:
      - ./config:/config:ro
